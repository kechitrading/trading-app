# Local development stack: `make dev` (or `docker compose -f deploy/docker-compose.yml --env-file .env up --build`).
# Ports bind to 127.0.0.1 only. Migrations run once via the `migrate` service before api/worker start.

name: aqta

x-app: &app
  build:
    context: ..
    dockerfile: deploy/Dockerfile
  image: aqta:dev
  env_file: ../.env
  environment:
    DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-aqta}:${POSTGRES_PASSWORD:-aqta}@postgres:5432/${POSTGRES_DB:-aqta}
    REDIS_URL: redis://redis:6379/0
    TRADING_MODE: paper
  restart: unless-stopped

services:
  postgres:
    image: timescale/timescaledb:2.17.2-pg16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-aqta}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-aqta}
      POSTGRES_DB: ${POSTGRES_DB:-aqta}
      TZ: UTC
    ports: ["127.0.0.1:5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports: ["127.0.0.1:6379:6379"]
    volumes: [redisdata:/data]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  migrate:
    <<: *app
    command: ["alembic", "upgrade", "head"]
    restart: "no"
    healthcheck: {disable: true}
    depends_on:
      postgres: {condition: service_healthy}

  api:
    <<: *app
    ports: ["127.0.0.1:8000:8000"]
    depends_on:
      migrate: {condition: service_completed_successfully}
      redis: {condition: service_healthy}

  worker:
    <<: *app
    command: ["arq", "aqta.worker.WorkerSettings"]
    healthcheck:
      test: ["CMD", "arq", "--check", "aqta.worker.WorkerSettings"]
      interval: 60s
      timeout: 10s
      retries: 3
    depends_on:
      migrate: {condition: service_completed_successfully}
      redis: {condition: service_healthy}

volumes:
  pgdata:
  redisdata:
