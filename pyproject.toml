[project]
name = "aqta"
version = "0.1.0"
description = "AQTA - AI Quant Trading Assistant (BRD-AQTA-001). Human-approved, paper-first trading desk."
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "Proprietary" }
authors = [{ name = "Kashyap" }]
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "sqlalchemy[asyncio]>=2.0.30",
    "asyncpg>=0.29",
    "alembic>=1.13",
    "redis>=5.0",
    "arq>=0.26",
    "aiogram>=3.10",
    "structlog>=24.1",
    "tzdata>=2024.1",
]

[project.optional-dependencies]
# Production secrets loader (NFR-008). Imported lazily only when SECRETS_PROVIDER=aws.
aws = ["boto3>=1.34"]
# Placeholders for later modules (analysis, forecasting, astrology, ingestion). Not wired yet.
analytics = [
    "pandas>=2.2",
    "numpy>=1.26",
    "scipy>=1.13",
    "statsmodels>=0.14",
    "pyswisseph>=2.10",
    "httpx>=0.27",
    "feedparser>=6.0",
]

[project.scripts]
aqta-audit = "aqta.audit.__main__:main"

[dependency-groups]
dev = [
    "ruff>=0.6",
    "mypy>=1.11",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "hypothesis>=6.108",
    "import-linter>=2.1",
    "pre-commit>=3.8",
    "fakeredis>=2.24",
    "httpx>=0.27",
    "pip-audit>=2.7",
]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aqta"]

# ---------------------------------------------------------------- ruff
[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]
extend-exclude = [".tools", ".uv-python", ".uv-cache"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "S", "SIM", "RUF", "ASYNC", "DTZ", "PT", "N", "C4", "T20"]
ignore = [
    "S101",   # assert is fine in tests and for invariants
    "RUF001", # allow unicode (rupee sign) in strings
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106", "S311", "DTZ001"]
"migrations/**" = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["aqta"]

# ---------------------------------------------------------------- mypy
[tool.mypy]
python_version = "3.12"
mypy_path = "src"
packages = ["aqta"]
plugins = ["pydantic.mypy"]
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
check_untyped_defs = true
no_implicit_optional = true

# Safety-critical modules: strict (see CLAUDE.md).
[[tool.mypy.overrides]]
module = ["aqta.core.*", "aqta.risk.*", "aqta.execution.*", "aqta.audit.*", "aqta.proposals.*"]
strict = true

[[tool.mypy.overrides]]
module = ["arq.*", "fakeredis.*", "boto3.*", "botocore.*", "asyncpg.*"]
ignore_missing_imports = true

# ---------------------------------------------------------------- pytest
[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-ra --strict-markers"
markers = [
    "integration: needs a real PostgreSQL (AQTA_TEST_DATABASE_URL); skipped otherwise",
    "smoke: end-to-end smoke tests",
]
filterwarnings = ["error::pytest.PytestUnraisableExceptionWarning"]

[tool.coverage.run]
source = ["aqta"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = false
exclude_also = [
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "\\.\\.\\.",
    "if __name__ == .__main__.:",
]

# ---------------------------------------------------------------- import-linter
[tool.importlinter]
root_package = "aqta"
include_external_packages = true

[[tool.importlinter.contracts]]
name = "RULE-013: risk and execution never depend on analysis (signals, forecasting, astrology)"
type = "forbidden"
source_modules = ["aqta.risk", "aqta.execution"]
forbidden_modules = ["aqta.signals", "aqta.forecasting", "aqta.astrology", "aqta.analysis"]

[[tool.importlinter.contracts]]
name = "Domain modules never import the web/bot/worker edges"
type = "forbidden"
source_modules = [
    "aqta.core", "aqta.audit", "aqta.risk", "aqta.execution", "aqta.proposals", "aqta.signals",
    "aqta.strategy", "aqta.astrology", "aqta.analysis", "aqta.forecasting", "aqta.arbitrage",
    "aqta.portfolio", "aqta.backtest", "aqta.learning", "aqta.reports", "aqta.llm", "aqta.ingestion",
]
forbidden_modules = ["fastapi", "starlette", "uvicorn", "aqta.api", "aqta.worker"]

[[tool.importlinter.contracts]]
name = "Core is the shared kernel and depends on no feature module"
type = "forbidden"
source_modules = ["aqta.core"]
forbidden_modules = [
    "aqta.audit", "aqta.risk", "aqta.execution", "aqta.proposals", "aqta.signals", "aqta.strategy",
    "aqta.astrology", "aqta.analysis", "aqta.forecasting", "aqta.arbitrage", "aqta.portfolio",
    "aqta.backtest", "aqta.learning", "aqta.reports", "aqta.llm", "aqta.ingestion",
    "aqta.notifications",
]
