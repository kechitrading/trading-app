name: Deploy

# NFR-015: deploy through GitHub only, never during trading hours, rollback within 10 minutes.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      action:
        description: "deploy or rollback"
        type: choice
        options: [deploy, rollback]
        default: deploy
      image_tag:
        description: "Image tag (deploy: defaults to the commit SHA; rollback: defaults to the previous tag)"
        required: false
        default: ""
      force:
        description: "Override the 08:30-23:45 IST weekday freeze (logged as a warning)"
        type: boolean
        default: false
      reason:
        description: "Why (required when force=true)"
        required: false
        default: ""

permissions:
  contents: read
  packages: write

concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/kechitrading/trading-app

jobs:
  guard:
    name: Trading-hours freeze (IST)
    runs-on: ubuntu-latest
    steps:
      - name: Refuse deploys 08:30-23:45 IST on weekdays
        env:
          FORCE: ${{ inputs.force || 'false' }}
          REASON: ${{ inputs.reason }}
        run: |
          dow=$(TZ=Asia/Kolkata date +%u)            # 1=Mon .. 7=Sun
          hm=$((10#$(TZ=Asia/Kolkata date +%H%M)))   # e.g. 0830 -> 830
          echo "IST now: $(TZ=Asia/Kolkata date '+%a %F %H:%M')"
          # Exchange holidays are treated as trading days (conservative).
          if [ "$dow" -le 5 ] && [ "$hm" -ge 830 ] && [ "$hm" -le 2345 ]; then
            if [ "$FORCE" = "true" ]; then
              if [ -z "$REASON" ]; then
                echo "::error::force=true requires a reason"; exit 1
              fi
              echo "::warning::FORCED deploy inside the trading window by ${GITHUB_ACTOR}: ${REASON} (NFR-015)"
            else
              echo "::error::Deploys are blocked 08:30-23:45 IST on weekdays (NFR-015). Re-run with force=true and a reason only in an emergency."
              exit 1
            fi
          fi

  build:
    name: Build and push image
    needs: guard
    if: ${{ github.event_name == 'push' || inputs.action == 'deploy' }}
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - id: tag
        run: echo "tag=${{ inputs.image_tag || github.sha }}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ steps.tag.outputs.tag }}
            ${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to AWS (Mumbai)
    needs: [guard, build]
    runs-on: ubuntu-latest
    environment: production  # configure required reviewers on this environment in GitHub
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: /opt/aqta/deploy.sh "${{ needs.build.outputs.tag }}"
      - name: Roll back on failure
        if: failure()
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: /opt/aqta/rollback.sh

  rollback:
    name: Roll back to previous image
    needs: guard
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.action == 'rollback' }}
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 10
    steps:
      - uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: /opt/aqta/rollback.sh ${{ inputs.image_tag }}
